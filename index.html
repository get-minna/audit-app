<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Tracker — SFRS(I) &amp; SSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F1ED; --card:#FFFFFF; --ink:#2A2926; --ink2:#4A4843; --muted:#7A766F; --line:#E5E1DA; --soft:#EFECE6; --soft2:#F7F5F1;
  --accent:#E06D1F; --accent-ink:#B4520F; --accent-soft:#FCEBDD;
  --r:16px; --shadow:0 1px 2px rgba(40,35,25,.04),0 4px 16px rgba(40,35,25,.04);
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}

/* sidebar navigation */
header{position:fixed;top:0;left:0;bottom:0;width:248px;z-index:20;background:var(--card);border-right:1px solid var(--line);overflow-y:auto}
.hwrap{display:flex;flex-direction:column;gap:30px;padding:26px 18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;padding:0 8px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:block}
.eng{color:var(--muted);font-size:.8rem;font-weight:500;line-height:1.35;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:11px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:.95rem;border-left:3px solid transparent}
nav a:hover{background:var(--soft2)}
nav a.on{background:var(--soft);color:var(--ink);font-weight:600;border-left-color:var(--accent)}
nav a .cnt{display:inline-block;min-width:22px;padding:0 7px;border-radius:20px;background:var(--accent);color:#fff;font-size:.72rem;text-align:center;line-height:20px}
body{padding-left:248px}
@media(max-width:900px){
  body{padding-left:0}
  header{position:sticky;bottom:auto;width:auto;border-right:none;border-bottom:1px solid var(--line);background:rgba(243,241,237,.94);backdrop-filter:blur(8px)}
  .hwrap{flex-direction:row;align-items:center;flex-wrap:wrap;gap:14px;padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;width:100%;background:var(--soft);padding:4px;border-radius:12px}
  nav a{border-left:none;padding:8px 14px;white-space:nowrap;gap:6px}
  nav a.on{background:var(--card);box-shadow:var(--shadow)}
}

main{max-width:1240px;margin:0 auto;padding:32px 28px 80px}
h1{font-size:1.9rem;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:1.25rem;letter-spacing:-.01em;margin:0 0 14px}
h3{font-size:1.08rem;margin:0}
.sub{color:var(--muted);margin:0 0 26px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.pagehead .sub{margin:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.35fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}html{font-size:16px}main{padding-left:16px;padding-right:16px}}

.stat .k{color:var(--muted);font-size:.85rem;font-weight:500}
.stat .v{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.stat .d{color:var(--muted);font-size:.85rem;margin-top:2px}
.stat.hl{border-color:var(--accent);background:linear-gradient(0deg,var(--card),var(--card)),var(--accent-soft)}
.stat.hl .v{color:var(--accent-ink)}

.btn{text-decoration:none;border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:11px;font-weight:600;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--soft2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 12px;font-size:.84rem;border-radius:9px}
.btn.danger{color:#9B2C1F}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:30px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--soft2);color:var(--ink2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.r-High{background:var(--accent);border-color:var(--accent);color:#fff}
.r-Medium{background:#E9E5DE;border-color:#D9D3C9;color:var(--ink)}
.r-Low{background:transparent;color:var(--muted)}
.p-P1{border-color:var(--ink);color:var(--ink)}
.chip{display:inline-block;padding:3px 10px;border-radius:8px;background:var(--soft);font-size:.78rem;font-weight:600;color:var(--ink2);border:none;cursor:pointer}
.chip:hover{background:var(--accent-soft);color:var(--accent-ink)}
.chip.sfrs{background:transparent;border:1px dashed #CFC9BF}

/* issue cards */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s;position:relative}
.icard:hover{border-color:#CFC8BC;transform:translateY(-1px)}
.icard.High::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--accent)}
.icard.done{opacity:.6}
.rank{font-weight:700;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.icard h3{font-size:1.06rem;line-height:1.35}
.amt{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.amt small{font-size:.8rem;color:var(--muted);font-weight:500;margin-right:4px}
.loc{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:.88rem;flex-wrap:wrap}
.loc b{font-weight:600;background:var(--soft);padding:1px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.loc svg{flex:none;color:var(--muted)}
.area{color:var(--muted);font-size:.84rem;font-weight:500}
.status{font-size:.8rem;font-weight:600;color:var(--muted)}
.status.Open{color:var(--accent-ink)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;font-size:.92rem;outline:none}
.input:focus{border-color:var(--accent)}
.search{flex:1;min-width:220px}
.reffilter{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-ink);border-radius:11px;padding:8px 12px;font-weight:600;font-size:.88rem}
.reffilter button{border:none;background:none;cursor:pointer;color:inherit;font-size:1rem;line-height:1}

/* bars */
.bar{height:10px;border-radius:10px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--ink2)}
.bar i.a{background:var(--accent)}
.brow{display:grid;grid-template-columns:140px 1fr 70px;gap:14px;align-items:center;padding:8px 0;font-size:.92rem}
.brow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.matbar{position:relative;height:14px;border-radius:14px;background:var(--soft);margin:18px 0 8px;overflow:visible}
.matbar i{display:block;height:100%;border-radius:14px;background:var(--accent)}
.matbar .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.matbar .tick span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:600;white-space:nowrap;color:var(--ink2)}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:none}
.li .t{flex:1;min-width:0}
.li .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t .m{color:var(--muted);font-size:.84rem}
.empty{color:var(--muted);text-align:center;padding:48px 20px}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

/* upload */
.drop{border:2px dashed #D3CDC2;border-radius:var(--r);padding:44px 24px;text-align:center;background:var(--soft2);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;color:var(--accent)}
.drop h3{font-size:1.15rem;margin-bottom:4px}
.drop p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
@media(max-width:700px){.tests,.f2{grid-template-columns:1fr}}
.tests label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.9rem;cursor:pointer}
.tests input{accent-color:var(--accent);margin-top:4px}
.tests small{display:block;color:var(--muted);font-size:.78rem}
.file{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);align-items:flex-start}
.file:first-child{border-top:none}
.fic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--ink2);flex:none}
.file .m{color:var(--muted);font-size:.84rem}
.sheets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.progress{margin-top:16px;display:none}
.progress.on{display:block}

/* standards */
.std{margin-bottom:18px}
.stdhead{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.code{font-weight:700;background:var(--ink);color:#fff;border-radius:9px;padding:4px 10px;font-size:.84rem;white-space:nowrap}
.code.sfrs{background:var(--soft);color:var(--ink)}
.para{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.para .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.para .pn{font-weight:700;font-variant-numeric:tabular-nums}
.ln{padding:6px 12px;border-left:3px solid transparent;border-radius:0 8px 8px 0;font-size:.95rem;color:var(--ink2)}
.ln.ind{padding-left:30px}
.ln.hl{background:var(--accent-soft);border-left-color:var(--accent);color:var(--ink)}
.ln .tag{float:right;font-size:.7rem;font-weight:700;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em;margin-left:10px}
.note{font-size:.84rem;color:var(--muted);background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:12px 16px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,28,24,.38);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.scrim.on{display:flex}
.modal{background:var(--bg);border-radius:20px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.modal.small{max-width:480px}
.mhead{background:var(--card);padding:24px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.mhead h2{margin:6px 0 0;font-size:1.35rem}
.mbody{padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.x{border:none;background:var(--soft);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1.2rem;flex:none}
.sec h4{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem;margin-bottom:14px}
.crumbs span.sep{color:#C4BEB3}
.crumbs .cell{background:var(--accent);color:#fff;font-weight:700;padding:2px 10px;border-radius:7px}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.xl{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
table.xl th,table.xl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 10px;white-space:nowrap;text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.xl thead th{background:var(--soft2);color:var(--muted);font-weight:600;font-size:.76rem}
table.xl thead tr.hn th{color:var(--ink);font-size:.82rem}
table.xl td.rn,table.xl th.rn{background:var(--soft2);color:var(--muted);text-align:center;width:44px}
table.xl tr.hi td{background:#FFF6EE}
table.xl tr.hi td.rn{background:var(--accent);color:#fff;font-weight:700}
table.xl td.hc{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft);font-weight:700}
table.xl th.hc{color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.kv{grid-template-columns:1fr 1fr}}
.kv>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv .k{font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.kv select{border:none;padding:0;font-weight:600;background:transparent;cursor:pointer;outline:none;width:100%}
.proc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.95rem}
.refblock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.refblock .rh{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.refblock .rh .ttl{font-weight:600}
.refblock .rh .sm{color:var(--muted);font-size:.84rem}
.reflist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:6px 12px}
.reflist label{display:flex;gap:10px;padding:5px 0;font-size:.88rem;cursor:pointer}
.reflist input{accent-color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:500;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mt{margin-top:18px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><div class="mark"><i></i></div><div>Audit Tracker<div class="eng" id="engline"></div></div></div>
    <nav id="nav">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#issues" data-v="issues">Issues<span class="cnt" id="navcnt"></span></a>
      <a href="#testing" data-v="testing">Upload &amp; test</a>
      <a href="#standards" data-v="standards">Standards</a>
    </nav>
  </div>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Reference library — paraphrased summaries of key requirements.
   Paragraph numbering follows the extant SSAs (which mirror ISAs)
   and SFRS(I) as issued by ISCA / ASC Singapore.
   ========================================================= */
const LIB = {
 'SSA 200':{kind:'SSA',title:'Overall Objectives of the Independent Auditor',paras:{
   '15':{t:'Professional skepticism',l:['Plan and perform the audit with professional skepticism.','Recognise that circumstances may exist that cause the financial statements to be materially misstated.']},
   '17':{t:'Sufficient appropriate audit evidence',l:['Obtain sufficient appropriate audit evidence to reduce audit risk to an acceptably low level.','This allows the auditor to draw reasonable conclusions on which to base the opinion.']}}},
 'SSA 230':{kind:'SSA',title:'Audit Documentation',paras:{
   '8':{t:'Form, content and extent of documentation',l:['Prepare documentation sufficient for an experienced auditor, with no prior connection to the audit, to understand:','(a) the nature, timing and extent of procedures performed;','(b) the results of those procedures and the audit evidence obtained; and','(c) significant matters arising, conclusions reached and significant professional judgements made.']}}},
 'SSA 240':{kind:'SSA',title:"The Auditor's Responsibilities Relating to Fraud",paras:{
   '26':{t:'Presumed fraud risk in revenue recognition',l:['When assessing risks of material misstatement due to fraud, presume there are risks of fraud in revenue recognition.','Evaluate which types of revenue, revenue transactions or assertions give rise to such risks.','If the presumption is rebutted, document the reasons (para 47).']},
   '31':{t:'Management override of controls',l:['Management is uniquely positioned to perpetrate fraud by overriding controls that otherwise appear to operate effectively.','The risk of management override is present in all entities and is treated as a significant risk.']},
   '32':{t:'Testing journal entries and other adjustments',l:['Irrespective of the assessed risk of management override, design and perform procedures to:','(a) test the appropriateness of journal entries recorded in the general ledger and other adjustments made in preparing the financial statements, including:','(i) inquiring of individuals involved in financial reporting about inappropriate or unusual activity relating to journal entries;','(ii) selecting journal entries and other adjustments made at the end of the reporting period; and','(iii) considering the need to test journal entries and adjustments throughout the period;','(b) review accounting estimates for bias; and','(c) evaluate the business rationale of significant transactions outside the normal course of business.']},
   'A43':{t:'Characteristics of fraudulent journal entries',l:['Inappropriate journal entries often share identifying characteristics, such as entries:','made to unrelated, unusual or seldom-used accounts;','made by individuals who typically do not make journal entries;','recorded at period end or as post-closing entries with little or no explanation;','made before or during preparation of the financial statements without account numbers; or','containing round numbers or consistent ending numbers.']}}},
 'SSA 265':{kind:'SSA',title:'Communicating Deficiencies in Internal Control',paras:{
   '9':{t:'Communication of significant deficiencies',l:['Communicate significant deficiencies in internal control identified during the audit in writing to those charged with governance on a timely basis.']}}},
 'SSA 315':{kind:'SSA',title:'Identifying and Assessing the Risks of Material Misstatement (Revised 2019)',paras:{
   '31':{t:'Assessing inherent risk',l:['For identified risks at the assertion level, assess inherent risk by assessing the likelihood and magnitude of misstatement.','Take into account how, and the degree to which, inherent risk factors affect susceptibility to misstatement.']},
   '32':{t:'Significant risks',l:['Determine whether any of the assessed risks of material misstatement are significant risks.']}}},
 'SSA 320':{kind:'SSA',title:'Materiality in Planning and Performing an Audit',paras:{
   '10':{t:'Materiality for the financial statements as a whole',l:['When establishing the overall audit strategy, determine materiality for the financial statements as a whole.','Where relevant, also determine lower materiality levels for particular classes of transactions, balances or disclosures.']},
   '11':{t:'Performance materiality',l:['Determine performance materiality to assess risks of material misstatement and to set the nature, timing and extent of further procedures.']}}},
 'SSA 330':{kind:'SSA',title:"The Auditor's Responses to Assessed Risks",paras:{
   '18':{t:'Substantive procedures for material items',l:['Irrespective of the assessed risks, design and perform substantive procedures for each material class of transactions, account balance and disclosure.']},
   '20':{t:'Financial statement closing process',l:['Agree or reconcile the financial statements with the underlying accounting records, including disclosures.','Examine material journal entries and other adjustments made during preparation of the financial statements.']},
   '21':{t:'Responding to significant risks',l:['Where a risk is assessed as significant, perform substantive procedures that are specifically responsive to that risk.']}}},
 'SSA 450':{kind:'SSA',title:'Evaluation of Misstatements Identified during the Audit',paras:{
   '5':{t:'Accumulation of identified misstatements',l:['Accumulate misstatements identified during the audit, other than those that are clearly trivial.']},
   '11':{t:'Effect of uncorrected misstatements',l:['Determine whether uncorrected misstatements are material, individually or in aggregate.','Consider the size and nature of the misstatements and the particular circumstances of their occurrence.']}}},
 'SSA 500':{kind:'SSA',title:'Audit Evidence',paras:{
   '6':{t:'Sufficient appropriate audit evidence',l:['Design and perform audit procedures that are appropriate in the circumstances to obtain sufficient appropriate audit evidence.']},
   '9':{t:'Information produced by the entity',l:['When using information produced by the entity, evaluate whether it is sufficiently reliable for the auditor’s purposes, including:','(a) obtaining audit evidence about the accuracy and completeness of the information; and','(b) evaluating whether the information is sufficiently precise and detailed.']}}},
 'SSA 505':{kind:'SSA',title:'External Confirmations',paras:{
   '7':{t:'External confirmation procedures',l:['Maintain control over external confirmation requests, including determining the information to be confirmed and selecting the confirming party.']}}},
 'SSA 520':{kind:'SSA',title:'Analytical Procedures',paras:{
   '5':{t:'Substantive analytical procedures',l:['Determine the suitability of analytical procedures for the assertions concerned.','Evaluate the reliability of the data from which expectations are developed.','Develop an expectation and determine the amount of difference from expected values that is acceptable without further investigation.']},
   '7':{t:'Investigating results',l:['Where analytical procedures identify fluctuations or relationships inconsistent with other information, or that differ significantly from expected values, investigate by inquiring of management and performing other procedures as necessary.']}}},
 'SSA 530':{kind:'SSA',title:'Audit Sampling',paras:{
   '14':{t:'Projecting misstatements',l:['For tests of details, project misstatements found in the sample to the population.']}}},
 'SSA 540':{kind:'SSA',title:'Auditing Accounting Estimates and Related Disclosures (Revised)',paras:{
   '13':{t:'Risk assessment for estimates',l:['Obtain an understanding of the entity’s requirements, methods, data and assumptions relevant to accounting estimates.','Review the outcome of previous accounting estimates, or their re-estimation.']},
   '18':{t:'Responses to assessed risks',l:['Design and perform further audit procedures responsive to the assessed risks of material misstatement for accounting estimates.','Consider the reasons for the assessment, including inherent risk factors such as estimation uncertainty, complexity and subjectivity.']}}},

/* risk scoring */
function impact(i){const a=Math.abs(i.amount||0),e=S.eng;if(i.amount==null)return 2;return a>=e.mat?4:a>=e.pm?3:a>=e.triv?2:1;}

const autoRisk=sc=>sc>=8?'High':sc>=4?'Medium':'Low';
const autoPri=sc=>sc>=9?'P1':sc>=4?'P2':'P3';

const RO={High:3,Medium:2,Low:1},PO={P1:3,P2:2,P3:1};
function rankSort(a,b){return (PO[b.pri]-PO[a.pri])||(RO[b.risk]-RO[a.risk])||(score(b)-score(a))||(Math.abs(b.amount||0)-Math.abs(a.amount||0));}

function compact(v){const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(2)+'m':a>=1e3?(v/1e3).toFixed(1)+'k':Math.round(v).toString();}

function num(v){if(typeof v==='number')return isFinite(v)?v:null;if(typeof v!=='string')return null;let s=v.trim();if(!s)return null;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}s=s.replace(/[,\s]|S\$|\$|SGD|USD/gi,'');if(s.endsWith('-')){neg=true;s=s.slice(0,-1);}if(!/^-?\d*\.?\d+$/.test(s))return null;const n=parseFloat(s);return neg?-n:n;}
function ymd(v){
  if(v==null||v==='')return null;
  if(Object.prototype.toString.call(v)==='[object Date]'&&!isNaN(v)){const d=v.getHours()>=23?new Date(v.getTime()+2*3600e3):v;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
  if(typeof v==='string'){const s=v.trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
    const t=Date.parse(s);if(!isNaN(t)&&/[a-z]/i.test(s)&&/\d{4}/.test(s))return ymd(new Date(t));}
  return null;}
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
function fmtCell(v,h){if(v==null)return'';if(typeof v==='number'&&h&&/code|\bno\b|\bid\b|#|number|year|sku/i.test(h))return String(v);if(Object.prototype.toString.call(v)==='[object Date]')return ymd(v);if(typeof v==='number')return Number.isInteger(v)?v.toLocaleString('en-SG'):v.toLocaleString('en-SG',{maximumFractionDigits:2});return String(v);}
const ERR=/^#(REF!|DIV\/0!|VALUE!|N\/A|NAME\?|NUM!|NULL!)/;

const COLRX=[
 ['user',/posted by|created by|entered by|prepared by|preparer|\buser\b/],
 ['date',/\bdate\b|posted on|posting|\btxn\b|period date/],
 ['age',/days|overdue|\bage\b|ageing|aging/],
 ['debit',/\bdebits?\b|\bdr\b/],
 ['credit',/\bcredits?\b|\bcr\b/],
 ['nrv',/\bnrv\b|net realis|net realiz|selling price/],
 ['cost',/\bcost\b/],
 ['qty',/\bqty\b|quantity|\bunits\b/],
 ['je',/journal|\bje\b|voucher|doc(ument)?\s*(no|number|#)|entry\s*(no|id|#|number)|\bref(erence)?\b/],
 ['cy',/current year|\bcy\b|this year/],
 ['py',/prior year|\bpy\b|previous|last year/],
 ['balance',/balance|closing/],
 ['amount',/amount|\bvalue\b|\bnet\b|\bsgd\b|\busd\b|\btotal\b/],

 ['desc',/desc|narration|memo|particular|detail|remark|explanation|text|item/],
 ['account',/account|\bgl\b|ledger|acct|line item|caption/],

function findHeader(rows){for(let i=0;i<Math.min(25,rows.length);i++){const r=rows[i]||[];const ne=r.filter(v=>v!=null&&v!=='').length;const st=r.filter(v=>typeof v==='string'&&v.trim()&&num(v)===null).length;if(st>=2&&st>=ne*0.6)return i;}return 0;}
function makeSheet(file,name,rows,rng){
  const hdr=findHeader(rows);const header=(rows[hdr]||[]).map(v=>v==null?'':String(v).trim());
  const ncols=Math.max(0,...rows.map(r=>(r||[]).length));
  const cols={};
  header.forEach((h,i)=>{const s=h.toLowerCase();if(!s)return;for(const [k,rx] of COLRX){if(cols[k]==null&&rx.test(s)){cols[k]=i;break;}}});
  // year-labelled comparative columns e.g. FY2026 / FY2025
  if(cols.cy==null||cols.py==null){const yc=header.map((h,i)=>{const m=String(h).match(/(19|20)\d{2}/);return m?{i,y:+m[0]}:null;}).filter(Boolean).filter(x=>![cols.date,cols.age].includes(x.i));
    if(yc.length>=2){yc.sort((a,b)=>b.y-a.y);if(cols.cy==null)cols.cy=yc[0].i;if(cols.py==null)cols.py=yc[1].i;if(cols.amount===yc[0].i||cols.amount===yc[1].i)delete cols.amount;}}
  // label column: the text-heaviest of the first 3 columns
  let label=0,best=-1;for(let c=0;c<Math.min(3,ncols);c++){let n=0;for(let r=hdr+1;r<rows.length;r++){const v=(rows[r]||[])[c];if(typeof v==='string'&&num(v)===null)n++;}if(n>best){best=n;label=c;}}
  let kind='Table';
  if(cols.age!=null)kind='Ageing';else if(cols.qty!=null&&(cols.cost!=null||cols.nrv!=null))kind='Inventory';else if(cols.cy!=null&&cols.py!=null)kind='Comparative';else if(cols.date!=null&&(cols.amount!=null||cols.debit!=null||cols.credit!=null))kind='Journal';else if(cols.debit!=null||cols.credit!=null||cols.balance!=null||cols.amount!=null)kind='Trial balance';
  return{file,name,rows,hdr,header,ncols,cols,label,kind,r0:rng.s.r,c0:rng.s.c};
}
function cellAddr(sh,r,c){return XLSX.utils.encode_cell({r:r+sh.r0,c:c+sh.c0});}
function ctx(sh,r,c){
  if(r==null)return null;const n=Math.max(sh.ncols,sh.header.length);let idx;
  if(n<=7)idx=[...Array(n).keys()];else{const set=new Set([sh.label]);let lo=Math.max(0,(c??0)-3);for(let k=lo;k<n&&set.size<7;k++)set.add(k);idx=[...set].sort((a,b)=>a-b);}
  const rows=[];for(let k=Math.max(sh.hdr+1,r-2);k<=Math.min(sh.rows.length-1,r+2);k++)rows.push({n:k+sh.r0+1,v:idx.map(j=>fmtCell((sh.rows[k]||[])[j],sh.header[j])),hi:k===r});
  return{h:idx.map(j=>sh.header[j]||''),cl:idx.map(j=>XLSX.utils.encode_col(j+sh.c0)),hc:c==null?-1:idx.indexOf(c),hr:sh.hdr+sh.r0+1,rows};
}

/* =========================================================
   Test engine
   ========================================================= */
function runTests(sh,out){
  const on=k=>S.tests[k]!==false;const C=sh.cols,E=S.eng,rows=sh.rows;
  const flagged=new Set();
  const mk=(test,r,c,amount,title,desc)=>{const i={id:uid(),test,title,desc,amount:amount==null?null:Math.round(amount*100)/100,file:sh.file,sheet:sh.name,cell:c!=null&&r!=null?cellAddr(sh,r,c):null,row:r!=null?r+sh.r0+1:null,col:c!=null?(sh.header[c]||XLSX.utils.encode_col(c+sh.c0)):'',ctx:ctx(sh,r,c),refs:TESTS[test].refs,created:Date.now(),status:'Open',notes:'',src:'auto'};rescore(i);out.push(i);if(r!=null)flagged.add(r);return i;};
  const get=(r,k)=>C[k]==null?null:(rows[r]||[])[C[k]];
  const amtCol=C.amount!=null?C.amount:C.debit!=null?C.debit:C.balance!=null?C.balance:C.cy!=null?C.cy:null;
  const amtOf=r=>{if(C.debit!=null||C.credit!=null){const d=num(get(r,'debit'))||0,cr=num(get(r,'credit'))||0;if(d===0&&cr===0)return C.amount!=null?num(get(r,'amount')):null;return d-cr;}if(C.amount!=null)return num(get(r,'amount'));if(C.balance!=null)return num(get(r,'balance'));if(C.cy!=null)return num(get(r,'cy'));return null;};
  const amtColOf=r=>{if(C.debit!=null||C.credit!=null){const d=num(get(r,'debit'))||0;return d!==0?C.debit:(C.credit!=null?C.credit:C.debit);}return amtCol;};
  const txt=r=>[get(r,'account'),get(r,'desc'),get(r,'party'),(rows[r]||[])[sh.label]].filter(v=>typeof v==='string').join(' ');
  const isTotal=r=>{const v=(rows[r]||[])[sh.label];return typeof v==='string'&&/\btotal\b/i.test(v);};
  const data=[];for(let r=sh.hdr+1;r<rows.length;r++){const row=rows[r]||[];if(row.some(v=>v!=null&&v!==''))data.push(r);}
  const items=data.filter(r=>!isTotal(r));
  const jeKey=r=>C.je!=null&&get(r,'je')!=null?'je:'+get(r,'je'):'r:'+r;
  const cap=(arr,n,fn)=>arr.sort((a,b)=>Math.abs(b.a)-Math.abs(a.a)).slice(0,n).forEach(fn);
  const fye=E.fye,win=addDays(fye,-5);
  const label=r=>{for(const v of [get(r,'desc'),get(r,'party'),(rows[r]||[])[sh.label],get(r,'account')])if(typeof v==='string'&&v.trim()&&num(v)===null)return v.trim();const v=get(r,'account')??get(r,'je');return v!=null?String(v):'Row '+(r+sh.r0+1);};

  // formula errors
  if(on('errors')){let n=0;for(const r of data){const row=rows[r]||[];for(let c=0;c<row.length&&n<10;c++){if(typeof row[c]==='string'&&ERR.test(row[c].trim())){mk('errors',r,c,null,`${row[c].trim()} error in "${sh.header[c]||'column '+XLSX.utils.encode_col(c+sh.c0)}"`,`The cell contains a spreadsheet error, so the figure cannot be relied upon. Row label: ${label(r)}.`);n++;}}}}

  // casting
  if(on('casting')){const numCols=[...new Set([C.amount,C.debit,C.credit,C.balance,C.cy,C.py].filter(v=>v!=null))];let n=0;
    for(const c of numCols){let lastTot=sh.hdr,prevTotals=[];for(const r of data){const st=num((rows[r]||[])[c]);if(!isTotal(r))continue;
      const since=data.filter(x=>x>lastTot&&x<r&&!isTotal(x)).reduce((s,x)=>s+(num((rows[x]||[])[c])||0),0);
      const all=items.filter(x=>x<r).reduce((s,x)=>s+(num((rows[x]||[])[c])||0),0);
      const pt=prevTotals.reduce((s,x)=>s+x,0);
      const suf=[];{let acc=0;for(let x=r-1;x>sh.hdr;x--){if(isTotal(x))break;const v=num((rows[x]||[])[c]);if(v!=null){acc+=v;suf.push(acc);}}}
      if(st!=null){const cands=[since,all,pt+since,...suf];if(prevTotals.length)cands.push(pt);const ok=cands.some(v=>Math.abs(v-st)<=1);
        if(!ok&&n<10){const near=cands.reduce((m,v)=>Math.abs(st-v)<Math.abs(st-m)?v:m,since);const diff=st-near;mk('casting',r,c,Math.abs(diff),`"${(rows[r]||[])[sh.label]}" does not cast (${sh.header[c]||'column'})`,`Stated total ${fmtCell(st)} vs re-cast ${fmtCell(Math.round(near*100)/100)} from the rows above — difference of ${fmtCell(Math.round(diff*100)/100)}.`);n++;}
        prevTotals.push(st);}lastTot=r;}}}

  // debits vs credits
  if(on('balance')&&C.debit!=null&&C.credit!=null){const d=items.reduce((s,r)=>s+(num(get(r,'debit'))||0),0),cr=items.reduce((s,r)=>s+(num(get(r,'credit'))||0),0);
    if(Math.abs(d-cr)>0.5){const tr=data.find(isTotal);const r=tr!=null?tr:items[items.length-1];mk('balance',r,C.debit,Math.abs(d-cr),`Debits and credits differ by ${moneyTxt(Math.abs(d-cr))}`,`Total debits ${moneyTxt(d)} vs total credits ${moneyTxt(cr)} across ${items.length} rows on "${sh.name}".`);}}

  // JE nets to zero
  if(on('jeBalance')&&sh.kind==='Journal'&&C.je!=null){const g=new Map();for(const r of items){const k=get(r,'je');if(k==null||k==='')continue;const a=amtOf(r);if(a==null)continue;if(!g.has(k))g.set(k,{s:0,r});g.get(k).s+=a;}
    const hasSigned=C.debit!=null||items.some(r=>(amtOf(r)||0)<0);
    if(hasSigned){const bad=[...g.entries()].filter(([k,v])=>Math.abs(v.s)>0.5).map(([k,v])=>({k,r:v.r,a:v.s}));cap(bad,10,b=>mk('jeBalance',b.r,C.je,Math.abs(b.a),`Journal ${b.k} is out of balance`,`The lines for journal ${b.k} net to ${moneyTxt(b.a)} instead of zero.`));}}

  if(sh.kind==='Journal'){
    const seenJE={dup:new Set(),round:new Set(),weekend:new Set(),rev:new Set(),cut:new Set(),mgmt:new Set()};
    const cand={dup:[],round:[],weekend:[],rev:[],cut:[],mgmt:[]};
    const seen=new Map();
    const revJE=new Set(items.filter(r=>{const t=txt(r);return /revenue|sales|turnover|income/i.test(t)&&!/expense|cost of/i.test(t);}).map(jeKey));
    for(const r of items){const a=amtOf(r);if(a==null||a===0)continue;const d=ymd(get(r,'date'));const je=jeKey(r);const t=txt(r);
      if(on('dup')){const key=[d,a.toFixed(2),String(get(r,'account')??'').toLowerCase(),String(get(r,'desc')??'').toLowerCase().trim(),String(get(r,'party')??'').toLowerCase()].join('|');
        if(seen.has(key)&&seen.get(key).je!==je){if(!seenJE.dup.has(je)){seenJE.dup.add(je);cand.dup.push({r,a,first:seen.get(key).r});}}else if(!seen.has(key))seen.set(key,{r,je});}
      if(on('round')&&Math.abs(a)>=Math.max(E.triv,10000)&&Math.abs(a)%1000===0&&!seenJE.round.has(je)){seenJE.round.add(je);cand.round.push({r,a});}
      if(d&&on('weekend')&&[0,6].includes(dow(d))&&!seenJE.weekend.has(je)){seenJE.weekend.add(je);cand.weekend.push({r,a,d});}
      if(d&&(d>win)){const isRev=revJE.has(je);
        if(isRev&&on('revCutoff')&&Math.abs(a)>=E.triv&&!seenJE.rev.has(je)){seenJE.rev.add(je);cand.rev.push({r,a,d});}
        else if(!isRev&&on('cutoff')&&(d>fye||Math.abs(a)>=E.pm*0.5)&&!seenJE.cut.has(je)){seenJE.cut.add(je);cand.cut.push({r,a,d});}}
      if(on('mgmtUser')&&C.user!=null){const u=String(get(r,'user')??'');if(/\b(cfo|ceo|coo|md|director|admin|administrator|owner|controller|sysadmin)\b/i.test(u)&&!seenJE.mgmt.has(je)){seenJE.mgmt.add(je);cand.mgmt.push({r,a,u});}}
    }
    cap(cand.rev,12,x=>mk('revCutoff',x.r,C.date,Math.abs(x.a),`Revenue of ${moneyTxt(Math.abs(x.a))} posted ${x.d>fye?'after':'just before'} year end`,`${label(x.r)} — dated ${x.d}, FYE ${fye}. Revenue recognition is a presumed fraud risk.`));
    cap(cand.mgmt,10,x=>mk('mgmtUser',x.r,C.user,Math.abs(x.a),`Entry posted by "${x.u}"`,`${label(x.r)} — posted by a senior management / privileged user, an indicator of potential management override.`));
    cap(cand.dup,10,x=>mk('dup',x.r,amtColOf(x.r),Math.abs(x.a),`Possible duplicate: ${label(x.r)}`,`Matches row ${x.first+sh.r0+1} on date, amount, account and description but has a different journal reference.`));
    cap(cand.cut,12,x=>mk('cutoff',x.r,C.date,Math.abs(x.a),`${x.d>fye?'Post year-end':'Period-end'} entry: ${label(x.r)}`,`Dated ${x.d} against FYE ${fye}. Confirm the transaction is recorded in the correct period.`));
    cap(cand.round,12,x=>mk('round',x.r,amtColOf(x.r),Math.abs(x.a),`Round-sum entry of ${moneyTxt(Math.abs(x.a))}`,`${label(x.r)} — exact multiple of 1,000. Round numbers are a characteristic of inappropriate journal entries.`));
    cap(cand.weekend,12,x=>mk('weekend',x.r,C.date,Math.abs(x.a),`Weekend posting on ${x.d}`,`${label(x.r)} — posted on a ${dow(x.d)===0?'Sunday':'Saturday'}.`));
  }

  // missing fields
  if(on('missing')&&sh.kind==='Journal'){const miss=[];for(const r of items){const a=amtOf(r);if(!a)continue;const m=[];if(C.date!=null&&!get(r,'date'))m.push(['date',C.date]);if(C.desc!=null&&!String(get(r,'desc')??'').trim())m.push(['description',C.desc]);if(C.account!=null&&!String(get(r,'account')??'').trim())m.push(['account',C.account]);if(m.length)miss.push({r,a,m});}
    if(miss.length){const f=miss[0];const tot=miss.reduce((s,x)=>s+Math.abs(x.a),0);mk('missing',f.r,f.m[0][1],tot,`${miss.length} row${miss.length>1?'s':''} missing ${[...new Set(miss.flatMap(x=>x.m.map(y=>y[0])))].join(' / ')}`,`Affected cells: ${miss.slice(0,8).map(x=>cellAddr(sh,x.r,x.m[0][1])).join(', ')}${miss.length>8?' …':''}. Total value ${moneyTxt(tot)}.`);}}

  // related parties
  if(on('related')){const rp=[];for(const r of items){const t=txt(r);if(/related part|\bdirector|shareholder|inter-?company|affiliate|subsidiar|holding co|key management|\brpt\b/i.test(t)){const a=amtOf(r);rp.push({r,a:a||0});}}
    const c=C.desc!=null?C.desc:C.party!=null?C.party:C.account!=null?C.account:sh.label;
    cap(rp,10,x=>mk('related',x.r,c,x.a?Math.abs(x.a):null,`Related party indicator: ${label(x.r)}`,`Text suggests a related party (director / shareholder / group entity). Confirm against the related party register and disclosures.`));}

  // negative asset balances (TB)
  if(on('negAsset')&&sh.kind==='Trial balance'){for(const r of items){const t=txt(r);if(/cash|bank|receivable|debtor|inventor|stock|prepay|deposit|property|plant|equipment|\bppe\b/i.test(t)&&!/payable|overdraft|accumulated|allowance|provision|impairment|depreciation|loan/i.test(t)){const a=amtOf(r);if(a!=null&&a<-0.5)mk('negAsset',r,amtColOf(r)===C.debit&&C.credit!=null?C.credit:amtColOf(r),Math.abs(a),`${label(r)} has a credit balance`,`Asset account carries a credit balance of ${moneyTxt(Math.abs(a))}. Check for misclassification or netting.`);}}}

  // fluctuation
  if(on('fluct')&&C.cy!=null&&C.py!=null){const fl=[];for(const r of items){const cy=num(get(r,'cy')),py=num(get(r,'py'));if(cy==null||py==null)continue;const d=cy-py,p=py?d/Math.abs(py):Infinity;if(Math.abs(d)>=E.pm*0.5&&Math.abs(p)>=0.2)fl.push({r,a:d,p,cy,py});}
    cap(fl,12,x=>mk('fluct',x.r,C.cy,Math.abs(x.a),`${label(x.r)} ${x.a>0?'up':'down'} ${isFinite(x.p)?Math.abs(x.p*100).toFixed(0)+'%':'from nil'}`,`Current year ${moneyTxt(x.cy)} vs prior year ${moneyTxt(x.py)} — movement of ${moneyTxt(x.a)}.`));}

  // ageing
  if(on('aged')&&sh.kind==='Ageing'){const ag=[];const bucket=sh.header.map((h,i)=>/(>|over|above)\s*90|90\s*\+|91|120|180|365/i.test(h)?i:-1).filter(i=>i>=0&&i!==C.age);
    for(const r of items){const days=num(get(r,'age'));const a=amtOf(r);if(days!=null&&days>90&&a)ag.push({r,a,days,c:C.age});for(const b of bucket){const v=num((rows[r]||[])[b]);if(v)ag.push({r,a:v,c:b,days:sh.header[b]});}}
    cap(ag,12,x=>mk('aged',x.r,x.c,Math.abs(x.a),`${label(x.r)} overdue ${typeof x.days==='number'?x.days+' days':x.days}`,`Outstanding ${moneyTxt(Math.abs(x.a))}. Assess recoverability and expected credit loss allowance.`));}

  // inventory
  if(on('inventory')&&sh.kind==='Inventory'){for(const r of items){const q=num(get(r,'qty')),co=num(get(r,'cost')),nr=num(get(r,'nrv'));
    if(q!=null&&q<0)mk('inventory',r,C.qty,co!=null?Math.abs(q*co):null,`Negative stock quantity: ${label(r)}`,`Quantity on hand is ${q}. Indicates a recording or cut-off error.`);
    else if(co!=null&&nr!=null&&nr<co)mk('inventory',r,C.nrv,q!=null?Math.abs((co-nr)*q):co-nr,`NRV below cost: ${label(r)}`,`Unit cost ${fmtCell(co)} vs NRV ${fmtCell(nr)}${q!=null?' on '+q+' units':''}. A write-down to NRV may be required.`);}}

  // above performance materiality (items not already flagged)
  if(on('material')&&!['Comparative','Trial balance'].includes(sh.kind)){const mt=[];const seen=new Set();for(const r of items){if(flagged.has(r))continue;const a=amtOf(r);const je=jeKey(r);if(a!=null&&Math.abs(a)>=E.pm&&!seen.has(je)){seen.add(je);mt.push({r,a});}}
    cap(mt,12,x=>mk('material',x.r,amtColOf(x.r),Math.abs(x.a),`Key item: ${label(x.r)}`,`${moneyTxt(Math.abs(x.a))} exceeds performance materiality of ${moneyTxt(E.pm)}.`));}

  // Benford
  if(on('benford')){const vals=items.map(amtOf).filter(a=>a!=null&&Math.abs(a)>=10).map(a=>+String(Math.abs(a)).replace(/^0\.?0*/,'')[0]).filter(d=>d>=1&&d<=9);
    if(vals.length>=300){const cnt=Array(10).fill(0);vals.forEach(d=>cnt[d]++);let mad=0,worst=1,wd=0;for(let d=1;d<=9;d++){const e=Math.log10(1+1/d),o=cnt[d]/vals.length;mad+=Math.abs(o-e);if(o-e>wd){wd=o-e;worst=d;}}mad/=9;
      if(mad>0.015)mk('benford',sh.hdr,amtCol,null,`Leading-digit pattern is unusual (MAD ${mad.toFixed(3)})`,`Across ${vals.length} amounts, the first-digit distribution does not conform to Benford's Law (MAD > 0.015). Digit ${worst} is over-represented by ${(wd*100).toFixed(1)} pts.`);}}
}

function analyzeWorkbook(wb,fname){
  const found=[];const meta={id:uid(),name:fname,at:Date.now(),sheets:[]};
  wb.SheetNames.forEach(sn=>{const ws=wb.Sheets[sn];if(!ws||!ws['!ref'])return;const rng=XLSX.utils.decode_range(ws['!ref']);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
    const sh=makeSheet(fname,sn,rows,rng);const before=found.length;runTests(sh,found);
    meta.sheets.push({name:sn,rows:rows.length,kind:sh.kind,issues:found.length-before});});
  return{meta,found};
}
function ingest(meta,found){
  const keys=new Set(S.issues.map(i=>[i.file,i.sheet,i.cell,i.test,i.title].join('|')));let added=0;
  for(const i of found){const k=[i.file,i.sheet,i.cell,i.test,i.title].join('|');if(!keys.has(k)){keys.add(k);S.issues.push(i);added++;}}
  meta.found=found.length;meta.added=added;S.files=S.files.filter(f=>f.name!==meta.name);S.files.unshift(meta);save();
  return added;
}
async function handleFiles(list){
  if(typeof XLSX==='undefined'){toast('Spreadsheet library did not load — check your connection');return;}
  const p=$('#progress');if(p){p.classList.add('on');p.querySelector('span').textContent='Reading '+list.length+' file(s)…';}
  let total=0;
  for(const f of list){try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const {meta,found}=analyzeWorkbook(wb,f.name);total+=ingest(meta,found);}catch(e){console.error(e);toast('Could not read '+f.name);}}
  render();toast(`Testing complete — ${total} new issue${total===1?'':'s'} logged`);
}

function vOverview(){
  const op=openIssues(),hi=op.filter(i=>i.risk==='High'),p1=op.filter(i=>i.pri==='P1');
  const E=S.eng;const seenLoc=new Map();op.forEach(i=>{const k=i.cell?[i.file,i.sheet,i.row].join('|'):i.id;seenLoc.set(k,Math.max(seenLoc.get(k)||0,Math.abs(i.amount||0)));});const exp=[...seenLoc.values()].reduce((s,v)=>s+v,0);
  const maxv=E.mat*1.5;const pct=Math.min(100,exp/maxv*100);const ratio=exp/E.mat;
  const byArea=AREAS.map(a=>({a,n:op.filter(i=>(i.area||TESTS[i.test]?.area)===a).length,v:op.filter(i=>(i.area||TESTS[i.test]?.area)===a).reduce((s,i)=>s+Math.abs(i.amount||0),0)})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const maxN=Math.max(1,...byArea.map(x=>x.n));
  const top=ranked().filter(i=>i.status!=='Resolved').slice(0,6);
  const res=S.issues.length?Math.round((S.issues.length-op.length)/S.issues.length*100):0;
  if(!S.issues.length&&!S.files.length)return `<div class="pagehead"><div><h1>Audit overview</h1><p class="sub">${esc(E.client)} · Financial year ending ${esc(E.fye)} · SFRS(I) framework, SSA-aligned testing</p></div></div>
   <div class="card empty"><b>No testing performed yet</b>Upload a general ledger, trial balance, ageing or financial statement workbook to run automated audit tests.<div class="row mt" style="justify-content:center"><a class="btn pri" href="#testing">Upload Excel files</a><button class="btn" data-act="sample">Try the sample workbook</button></div></div>`;
  return `<div class="pagehead"><div><h1>Audit overview</h1><p class="sub">${esc(E.client)} · Financial year ending ${esc(E.fye)} · SFRS(I) framework, SSA-aligned testing</p></div><div class="row"><button class="btn" data-act="add">+ Add finding</button><a class="btn pri" href="#testing">Upload &amp; test</a></div></div>
  <div class="grid g4">
   <div class="card stat"><div class="k">Open issues</div><div class="v num">${op.length}</div><div class="d">${res}% of ${S.issues.length} resolved</div></div>
   <div class="card stat hl"><div class="k">High risk</div><div class="v num">${hi.length}</div><div class="d">${p1.length} at priority P1</div></div>
   <div class="card stat"><div class="k">Open exposure</div><div class="v num">${esc(E.cur)} ${compact(exp)}</div><div class="d">${ratio>=2?ratio.toFixed(1)+'× ':(ratio*100).toFixed(0)+'% of '}overall materiality</div></div>
   <div class="card stat"><div class="k">Files tested</div><div class="v num">${S.files.length}</div><div class="d">${S.files.reduce((s,f)=>s+f.sheets.length,0)} sheets analysed</div></div>

function filtered(){

  const rk=new Map(ranked().map((i,k)=>[i.id,k+1]));
  if(UI.sort==='amount')list.sort((a,b)=>Math.abs(b.amount||0)-Math.abs(a.amount||0));else if(UI.sort==='new')list.sort((a,b)=>b.created-a.created);else list.sort((a,b)=>rk.get(a.id)-rk.get(b.id));
  return {list,rk};
}

function linkedLines(){const m={};openIssues().forEach(i=>(i.refs||[]).forEach(r=>{const k=refKey(r);m[k]=m[k]||{n:0,h:new Set()};m[k].n++;const P=LIB[r.s]?.paras[r.p];(r.h==='all'?P?.l.map((_,x)=>x):r.h||[]).forEach(x=>m[k].h.add(x));}));return m;}
function paraLines(P,hset){return P.l.map((ln,x)=>`<div class="ln ${/^\((i|ii|iii|iv)\)/.test(ln)||/^(made|containing|recorded)/.test(ln)?'ind':''} ${hset&&hset.has(x)?'hl':''}">${hset&&hset.has(x)?'<span class="tag">Relevant</span>':''}${esc(ln)}</div>`).join('');}

  const entries=Object.entries(LIB).filter(([k,v])=>(!kf||v.kind===kf)&&(!q||(k+' '+v.title+' '+Object.entries(v.paras).map(([p,x])=>p+' '+x.t+' '+x.l.join(' ')).join(' ')).toLowerCase().includes(q)));
  return `<div class="pagehead"><div><h1>Standards reference</h1><p class="sub">SSA and SFRS(I) requirements linked to your findings. Highlighted lines are cited by open issues.</p></div></div>

   ${open?Object.entries(v.paras).map(([p,P])=>{const li=L[k+'|'+p];return `<div class="para" id="p-${esc((k+'-'+p).replace(/[^\w-]/g,''))}"><div class="ph"><span class="pn">¶${esc(p)}</span><span style="font-weight:600">${esc(P.t)}</span><span class="sp"></span>${li?`<button class="btn sm" data-reffilter="${esc(k+'|'+p)}">${li.n} linked issue${li.n>1?'s':''} →</button>`:''}</div>${paraLines(P,li?.h)}</div>`;}).join(''):''}</div>`;}).join('')}`;
}

/* ---------- modal / toast ---------- */
function modal(html,small){$('#modal').className='modal'+(small?' small':'');$('#modal').innerHTML=html;$('#scrim').classList.add('on');$('#scrim').scrollTop=0;}
function closeModal(){$('#scrim').classList.remove('on');$('#modal').innerHTML='';}
function confirmBox(msg,label,fn){modal(`<div class="mhead"><div style="flex:1"><h2 style="margin:0">${esc(msg)}</h2></div></div><div class="mbody"><div class="row"><span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="okbtn">${esc(label)}</button></div></div>`,true);$('#okbtn').onclick=()=>{fn();closeModal();};}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}

function csv(){const h=['Rank','Risk','Priority','Status','Area','Title','Amount','Currency','File','Sheet','Cell','Row','SSA/SFRS(I) references','Description','Notes'];const rk=new Map(ranked().map((i,k)=>[i.id,k+1]));
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return [h,...ranked().map(i=>[rk.get(i.id),i.risk,i.pri,i.status,i.area||TESTS[i.test]?.area,i.title,i.amount,S.eng.cur,i.file,i.sheet,i.cell,i.row,(i.refs||[]).map(r=>r.s+' para '+r.p).join('; '),i.desc,i.notes])].map(r=>r.map(q).join(',')).join('\n');}

  d.ondragover=e=>{e.preventDefault();d.classList.add('over');};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files.length)handleFiles([...e.dataTransfer.files]);};}

document.addEventListener('click',e=>{
  const ref=e.target.closest('[data-ref]');if(ref){e.stopPropagation();const [s,p]=ref.dataset.ref.split('|');const P=LIB[s]?.paras[p];if(P)modal(`<div class="mhead"><div style="flex:1"><span class="code ${LIB[s].kind==='SFRS(I)'?'sfrs':''}">${esc(s)} ¶${esc(p)}</span><h2>${esc(P.t)}</h2><div class="muted">${esc(LIB[s].title)}</div></div><button class="x" data-act="close">×</button></div><div class="mbody"><div class="refblock">${paraLines(P,linkedLines()[ref.dataset.ref]?.h)}</div><div class="row"><span class="sp"></span><button class="btn" data-reffilter="${esc(ref.dataset.ref)}">Show linked issues</button></div></div>`,true);return;}
  const rf=e.target.closest('[data-reffilter]');if(rf){UI.f={q:'',risk:'',pri:'',status:'',area:'',file:'',ref:rf.dataset.reffilter};closeModal();location.hash='issues';if(UI.view==='issues')render();return;}

  const sd=e.target.closest('[data-std]');if(sd){const k=sd.dataset.std;const L=linkedLines();const cur=UI.openStd[k]??(Object.keys(LIB[k].paras).some(p=>L[k+'|'+p])||!!UI.stdq);UI.openStd[k]=!cur;render();return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;

  else if(act==='clearref'){UI.f.ref='';render();}
  else if(act==='del'){const id=a.dataset.id;confirmBox('Delete this issue?','Delete',()=>{S.issues=S.issues.filter(i=>i.id!==id);save();render();toast('Issue deleted');});}
  else if(act==='rmfile'){const f=S.files.find(x=>x.id===a.dataset.id);confirmBox(`Remove ${f.name} and its auto-detected issues?`,'Remove',()=>{S.issues=S.issues.filter(i=>!(i.file===f.name&&i.src==='auto'));S.files=S.files.filter(x=>x.id!==f.id);save();render();});}
  else if(act==='reset')confirmBox('Clear all issues, files and settings?','Clear everything',()=>{S=defaults();save();render();toast('All data cleared');});
  else if(act==='copycsv'){const text=csv();const fallback=()=>modal(`<div class="mhead"><div style="flex:1"><h2 style="margin:0">Issues as CSV</h2><div class="muted">Select all and copy into Excel.</div></div><button class="x" data-act="close">×</button></div><div class="mbody"><textarea class="input" style="width:100%;min-height:320px;font-family:monospace;font-size:.8rem">${esc(text)}</textarea></div>`);
    try{navigator.clipboard.writeText(text).then(()=>toast('Copied — paste into Excel'),fallback);}catch(err){fallback();}}
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'){closeModal();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scrim').classList.contains('on')){closeModal();render();}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f==='q'){UI.f.q=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-f="q"]');n.focus();n.setSelectionRange(pos,pos);}
  else if(t.dataset.stdq!==undefined){UI.stdq=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-stdq]');n.focus();n.setSelectionRange(pos,pos);}
  else if(t.dataset.notes){const i=S.issues.find(x=>x.id===t.dataset.notes);if(i){i.notes=t.value;save();}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&t.dataset.f!=='q'){UI.f[t.dataset.f]=t.value;render();}
  else if(t.dataset.sort!==undefined){UI.sort=t.value;render();}
  else if(t.dataset.stdk!==undefined){UI.stdk=t.value;render();}
  else if(t.dataset.t){S.tests[t.dataset.t]=t.checked;save();}
  else if(t.dataset.e){const k=t.dataset.e;let v=t.value;if(['mat','pm','triv'].includes(k))v=+v||0;S.eng[k]=v;if(k==='mat'){S.eng.pm=Math.round(v*0.75);S.eng.triv=Math.round(v*0.05);}S.issues.forEach(rescore);save();render();toast('Settings saved · issues re-ranked');}
  else if(t.dataset.iset){const i=S.issues.find(x=>x.id===t.dataset.id);if(i){i[t.dataset.iset]=t.value;if(t.dataset.iset!=='status')i.ovr=true;save();toast('Updated');}}
});

function route(){const h=location.hash.slice(1);UI.view=['overview','issues','testing','standards'].includes(h)?h:'overview';closeModal();render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
